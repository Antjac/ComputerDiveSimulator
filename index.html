<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Computer dive simulation</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;700&family=Oswald:wght@400;500&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <div class="brand-row">
          <h1 data-i18n="title"></h1>
          <button class="btn tour-open" id="tour-open" data-i18n-title="tourOpen"><span data-i18n="tourOpen"></span><span class="icon" aria-hidden="true">?</span></button>
        </div>
        <p class="sub" data-i18n="subtitle"></p>
      </div>
      <div class="header-actions">
        <label class="field inline">
          <span data-i18n="computer"></span>
          <select id="computer-select"></select>
        </label>
        <button class="btn" id="about-open" data-i18n-title="about"><span data-i18n="about"></span><span class="icon" aria-hidden="true">i</span></button>
        <div class="seg-toggle" role="group" aria-label="Language">
          <button data-lang="fr">FR</button><button data-lang="en">EN</button>
        </div>
      </div>
    </header>

    <main class="app">
      <section class="panel scene-panel" id="scene-panel">
        <canvas id="scene" aria-label="Water column"></canvas>
        <canvas id="scene3d" aria-label="3D dive view" hidden></canvas>
        <div class="scene-top">
          <div class="seg-toggle" role="group" aria-label="View">
            <button data-view="2d">2D</button><button data-view="3d">3D</button>
          </div>
          <select id="env-select" hidden></select>
        </div>
        <p class="scene-hint" id="scene-hint" data-i18n="hint3d" hidden></p>
        <div class="scene-ctl">
          <button data-move="-1" data-i18n-title="rateUp">▲</button>
          <button data-stop data-i18n-title="rateStop">■</button>
          <button data-move="1" data-i18n-title="rateDown">▼</button>
        </div>
        <div class="scene-ctl turn" id="turn-ctl" hidden>
          <button data-turn="-1" aria-label="Turn left">◀</button>
          <button data-turn="1" aria-label="Turn right">▶</button>
        </div>
        <!-- Rescue alert (main.ts, renderRescue): the simulation is stopped. -->
        <div class="rescue" id="rescue" role="alertdialog" aria-labelledby="rescue-title" aria-describedby="rescue-body" hidden>
          <div class="rescue-card">
            <div class="beacon" aria-hidden="true"><i class="beam"></i><i class="glint"></i></div>
            <p class="rescue-stop" data-i18n="rescueStop"></p>
            <h2 id="rescue-title"></h2>
            <div id="rescue-body"></div>
            <div class="button-row">
              <button class="btn primary" id="rescue-reset" data-i18n="rescueReset"></button>
              <button class="btn" id="rescue-hide" data-i18n="rescueHide"></button>
            </div>
          </div>
        </div>
        <button class="rescue-mini" id="rescue-mini" data-i18n-title="rescueShow" hidden><span class="beacon" aria-hidden="true"><i class="beam"></i><i class="glint"></i></span></button>
        <!-- Boat offering a full tank at the surface (main.ts, updateBoat). -->
        <div class="boat-offer" id="boat-offer" role="dialog" aria-labelledby="boat-text" hidden>
          <p id="boat-text"></p>
          <p class="boat-note" id="boat-note" data-i18n="boatAskNote"></p>
          <div class="boat-btns" id="boat-btns">
            <button class="btn primary" id="boat-yes" data-i18n="boatYes"></button>
            <button class="btn" id="boat-no" data-i18n="boatNo"></button>
          </div>
        </div>
        <div class="scene-hud">
          <span id="hud-clock"></span>
          <span id="hud-state"></span>
        </div>
      </section>

      <section class="panel device-panel">
        <p class="device-caption" id="device-caption"></p>
        <div id="device" class="device-host"></div>
        <div id="spg" class="spg" hidden></div>
        <div id="device-alarms" class="alarms" aria-live="polite"></div>
        <div class="device-hint" id="device-hint"></div>
        <div class="btn-tip" id="btn-tip" role="tooltip" hidden></div>
        <div class="profile-box">
          <div class="chart-wrap"><canvas id="profile"></canvas><div class="tooltip" id="profile-tip" hidden></div></div>
        </div>
      </section>

      <section class="panel side-panel">
        <nav class="tabs" role="tablist">
          <button data-tab="settings" class="on" data-i18n="settings"></button>
          <button data-tab="compare" data-i18n="compareShort"></button>
          <button data-tab="tissues" data-i18n="tissuesShort"></button>
          <button data-tab="log" data-i18n="logShort"></button>
        </nav>

        <div class="sheet" id="sheet">
        <button class="sheet-close" id="sheet-close" data-i18n-title="close" aria-label="Close">✕</button>
        <div class="tab-body" data-pane="settings">
          <div id="algo-info" class="algo-info"></div>
          <div class="settings-grid">
            <div id="computer-settings" class="contents"></div>
            <label class="field"><span data-i18n="gas"></span><select id="gas-select"></select></label>
            <label class="field"><span data-i18n="rescueAlert"></span><select id="rescue-select"></select></label>
            <p class="muted small grid-hint" data-i18n="rescueHelp"></p>
          </div>
          <details class="advanced" id="advanced">
            <summary><span data-i18n="advanced"></span> <span class="adv-sum" id="adv-summary"></span></summary>
            <div class="settings-grid">
              <!-- The dive itself first, then the computer. -->
              <label class="field"><span data-i18n="units"></span><select id="units-select"></select></label>
              <label class="field"><span data-i18n="site"></span><select id="site-select"></select></label>
              <label class="field"><span data-i18n="tank"></span><select id="tank-select"></select></label>
              <label class="field"><span data-i18n="reserve"></span><select id="reserve-select"></select></label>
              <label class="field"><span data-i18n="rmv"></span><select id="rmv-select"></select></label>
              <div id="computer-settings-adv" class="contents"></div>
              <label class="field"><span data-i18n="transmitter"></span><select id="tx-select"></select></label>
              <p class="muted small tx-hint" id="tx-hint"></p>
            </div>
          </details>
          <div class="field">
            <span data-i18n="speed"></span>
            <div id="speed-group" class="seg-toggle wide" role="group"></div>
          </div>
          <div class="button-row">
            <button id="btn-pause" class="btn"></button>
            <button id="btn-skip" class="btn" data-i18n="surfaceSkip"></button>
            <button id="btn-reset" class="btn danger" data-i18n="resetShort"></button>
          </div>
          <details class="help">
            <summary data-i18n="help"></summary>
            <p data-i18n="helpText"></p>
            <p><span data-i18n="helpFree"></span> <a class="mail" href="mailto:antoalex@free.fr">antoalex@free.fr</a></p>
          </details>
          <p class="disclaimer" data-i18n="disclaimer"></p>
        </div>

        <div class="tab-body" data-pane="compare" hidden>
          <table class="compare" id="compare-table"></table>
        </div>

        <div class="tab-body" data-pane="tissues" hidden>
          <div class="gf-stats">
            <div class="gf-stat" data-i18n-title="gf99Help"><span>GF99</span><b id="gf99-val"></b></div>
            <div class="gf-stat" data-i18n-title="surfGfHelp"><span>SurfGF</span><b id="surfgf-val"></b></div>
            <div class="gf-stat"><span data-i18n="leading"></span><b id="lead-val"></b></div>
          </div>
          <div class="seg-toggle" role="group" id="tissue-mode">
            <button data-tmode="now" data-i18n="tissuesNow"></button><button data-tmode="surf" data-i18n="tissuesSurf"></button>
          </div>
          <p class="muted small" id="tissues-help"></p>
          <div class="chart-wrap grow"><canvas id="tissues"></canvas><div class="tooltip" id="tissue-tip" hidden></div></div>
        </div>

        <div class="tab-body" data-pane="log" hidden>
          <div id="logbook"></div>
        </div>
        </div>
      </section>
    </main>
    <dialog class="modal intro" id="intro" aria-labelledby="intro-title">
      <h2 id="intro-title" data-i18n="introTitle"></h2>
      <p class="lead" data-i18n="introEdu"></p>
      <p data-i18n="introApprox"></p>
      <p data-i18n="introBrands"></p>
      <div class="modal-actions">
        <button class="btn" id="intro-tour" data-i18n="introTour"></button>
        <button class="btn primary" id="intro-ok" data-i18n="introOk"></button>
      </div>
    </dialog>
    <dialog class="modal about" id="about" aria-labelledby="about-title">
      <h2 id="about-title" data-i18n="about"></h2>
      <p class="lead" data-i18n="introEdu"></p>
      <h3 data-i18n="aboutModels"></h3>
      <table class="compare" id="about-models"></table>
      <p data-i18n="aboutModelsNote"></p>
      <h3 data-i18n="aboutBrandsTitle"></h3>
      <p data-i18n="aboutBrands"></p>
      <p><span data-i18n="aboutRemoval"></span> <a class="mail" href="mailto:antoalex@free.fr">antoalex@free.fr</a></p>
      <h3 data-i18n="aboutLicenceTitle"></h3>
      <p data-i18n="aboutLicence"></p>
      <form method="dialog"><button class="btn primary" data-i18n="close" autofocus></button></form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
